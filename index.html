<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Tubes AI - Random House & Grass Variants</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            background-color: #1e1e1e;
            color: #fff;
            margin: 20px;
        }

        .panel {
            margin-bottom: 15px;
            padding: 15px;
            background: #2d2d2d;
            border-radius: 8px;
            display: inline-block;
        }

        canvas {
            border: 4px solid #444;
            background-color: #7cb342;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }

        select,
        button {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #444;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #666;
        }

        #resetBtn {
            background: #e74c3c;
            display: none;
        }

        #resetBtn:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>
    <h1>cimahi dikejar lampung</h1>

    <div class="panel">
        <label>Algoritma: </label>
        <select id="algorithm" onchange="recalculatePath()">
            <option value="astar-manhattan">A* (Heuristik Manhattan)</option>
            <option value="astar-euclidean">A* (Heuristik Euclidean)</option>
            <option value="ucs">UCS (Tanpa Heuristik)</option>
        </select>
        <button onclick="resetGame()" id="acakMapBtn">acak map</button>
        <button onclick="resetGame()" id="resetBtn">restart</button>

    
    </div>

    <br>
    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const COLS = 20;
        const ROWS = 20;
        const TILE = canvas.width / COLS;

        let grid = [];
        let grassGrid = []; // Matriks jenis rumput random
        let houseGrid = []; // Matriks jenis rumah random
        let player = { x: 18, y: 18 };
        let npc = { x: 1, y: 1 };

        let currentPath = [];
        let exploredNodes = [];
        let gameOver = false;

        // ==========================================
        // AREA CUSTOM GAMBAR (TOTAL 10 ASET)
        // ==========================================
        const imgGrass1 = new Image(); imgGrass1.src = 'grass1.png';
        const imgGrass2 = new Image(); imgGrass2.src = 'grass2.png';
        const imgGrass3 = new Image(); imgGrass3.src = 'grass3.png';
        const imgWater = new Image(); imgWater.src = 'water.png';
        const imgPlayer = new Image(); imgPlayer.src = 'hero.png';
        const imgNPC = new Image(); imgNPC.src = 'enemy.png';
        const imgTree = new Image(); imgTree.src = 'tree.png';

        // 5 Variasi Rumah
        const imgHouse1 = new Image(); imgHouse1.src = 'house1.png';
        const imgHouse2 = new Image(); imgHouse2.src = 'house2.png';
        const imgHouse3 = new Image(); imgHouse3.src = 'house3.png';
        const imgHouse4 = new Image(); imgHouse4.src = 'house4.png';
        const imgHouse5 = new Image(); imgHouse5.src = 'house5.png';

        // Total ada 12 aset gambar yang dimuat
        let imagesLoaded = 0;
        function checkLoad() {
            imagesLoaded++;
            if (imagesLoaded === 12) render();
        }
        imgGrass1.onload = checkLoad;
        imgGrass2.onload = checkLoad;
        imgGrass3.onload = checkLoad;
        imgWater.onload = checkLoad;
        imgPlayer.onload = checkLoad;
        imgNPC.onload = checkLoad;
        imgTree.onload = checkLoad;
        imgHouse1.onload = checkLoad;
        imgHouse2.onload = checkLoad;
        imgHouse3.onload = checkLoad;
        imgHouse4.onload = checkLoad;
        imgHouse5.onload = checkLoad;
        // ==========================================

        function initGrid() {
            grid = [];
            grassGrid = [];
            houseGrid = [];

            for (let r = 0; r < ROWS; r++) {
                let row = [];
                let grassRow = [];
                let houseRow = [];

                for (let c = 0; c < COLS; c++) {
                    let type = 0;
                    let rand = Math.random();
                    let isEntity = (c === player.x && r === player.y) || (c === npc.x && r === npc.y);

                    if (!isEntity) {
                        if (rand < 0.08) type = 1;      // Rumah (1)
                        else if (rand < 0.18) type = 2; // Pohon (2)
                        else if (rand < 0.28) type = 3; // Sungai / Air (3)
                    }
                    row.push(type);

                    // Random jenis rumput (1-3)
                    grassRow.push(Math.floor(Math.random() * 3) + 1);
                    // Random jenis rumah (1-5)
                    houseRow.push(Math.floor(Math.random() * 5) + 1);
                }
                grid.push(row);
                grassGrid.push(grassRow);
                houseGrid.push(houseRow);
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Render Tanah (Rumput Random) & Sungai (Air) di Background
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let px = c * TILE;
                    let py = r * TILE;

                    if (grid[r][c] === 3) {
                        if (imgWater.complete && imgWater.naturalHeight !== 0) {
                            ctx.drawImage(imgWater, px, py, TILE, TILE);
                        } else {
                            ctx.fillStyle = "#3498db";
                            ctx.fillRect(px, py, TILE, TILE);
                        }
                    } else {
                        let gType = grassGrid[r][c];
                        let targetGrass = (gType === 1) ? imgGrass1 : (gType === 2) ? imgGrass2 : imgGrass3;

                        if (targetGrass.complete && targetGrass.naturalHeight !== 0) {
                            ctx.drawImage(targetGrass, px, py, TILE, TILE);
                        } else {
                            ctx.fillStyle = "#7cb342";
                            ctx.fillRect(px, py, TILE, TILE);
                        }
                    }

                    ctx.strokeStyle = "rgba(0,0,0,0.05)";
                    ctx.strokeRect(px, py, TILE, TILE);
                }
            }

            // 2. Render Overlay Node Explored (Area putih transparan untuk AI)
            ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
            for (let node of exploredNodes) {
                ctx.fillRect(node.x * TILE, node.y * TILE, TILE, TILE);
            }

            // 3. Render Jalur Pathfinding (Garis merah)
            if (!gameOver) {
                ctx.strokeStyle = "rgba(231, 76, 60, 0.8)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                if (currentPath.length > 0) {
                    ctx.moveTo(npc.x * TILE + TILE / 2, npc.y * TILE + TILE / 2);
                    for (let p of currentPath) {
                        ctx.lineTo(p.x * TILE + TILE / 2, p.y * TILE + TILE / 2);
                    }
                    ctx.stroke();
                }
            }

            // 4. Render Rintangan (Rumah Random 1-5 & Pohon) di atas tanah
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let px = c * TILE;
                    let py = r * TILE;

                    if (grid[r][c] === 1) {
                        let hType = houseGrid[r][c];
                        let targetHouse = (hType === 1) ? imgHouse1 :
                            (hType === 2) ? imgHouse2 :
                                (hType === 3) ? imgHouse3 :
                                    (hType === 4) ? imgHouse4 : imgHouse5;

                        if (targetHouse.complete && targetHouse.naturalHeight !== 0) {
                            ctx.drawImage(targetHouse, px, py, TILE, TILE);
                        } else {
                            ctx.fillStyle = "#ecf0f1"; ctx.fillRect(px + 5, py + 5, TILE - 10, TILE - 10);
                        }
                    } else if (grid[r][c] === 2) {
                        if (imgTree.complete && imgTree.naturalHeight !== 0) {
                            ctx.drawImage(imgTree, px, py, TILE, TILE);
                        } else {
                            ctx.fillStyle = "#2e7d32"; ctx.beginPath(); ctx.arc(px + TILE / 2, py + TILE / 2, TILE / 3, 0, Math.PI * 2); ctx.fill();
                        }
                    }
                }
            }

            // 5. Render Entitas (Player & NPC)
            let px = player.x * TILE;
            let py = player.y * TILE;
            let nx = npc.x * TILE;
            let ny = npc.y * TILE;

            if (!gameOver) {
                if (imgPlayer.complete && imgPlayer.naturalHeight !== 0) {
                    ctx.drawImage(imgPlayer, px + 2, py + 2, TILE - 4, TILE - 4);
                } else {
                    ctx.fillStyle = "#f1c40f"; ctx.fillRect(px + 4, py + 4, TILE - 8, TILE - 8);
                }
            }

            if (imgNPC.complete && imgNPC.naturalHeight !== 0) {
                ctx.drawImage(imgNPC, nx + 2, ny + 2, TILE - 4, TILE - 4);
            } else {
                ctx.fillStyle = "#e74c3c"; ctx.fillRect(nx + 4, ny + 4, TILE - 8, TILE - 8);
            }

            // Game Over Screen
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#e74c3c";
                ctx.font = "bold 40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("wasted", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "white";
                ctx.font = "20px Arial";
                ctx.fillText("fakyu anjg", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function getHeuristic(x, y, algo) {
            if (algo === "ucs") return 0;
            let dx = Math.abs(x - player.x);
            let dy = Math.abs(y - player.y);
            if (algo === "astar-manhattan") return dx + dy;
            if (algo === "astar-euclidean") return Math.sqrt(dx * dx + dy * dy);
            return 0;
        }

        function recalculatePath() {
            if (gameOver) return;

            let algo = document.getElementById("algorithm").value;
            let frontier = [];
            let startNode = { x: npc.x, y: npc.y, g: 0, f: 0, parent: null };
            frontier.push(startNode);

            exploredNodes = [];
            let visited = new Map();
            let finalNode = null;

            while (frontier.length > 0) {
                frontier.sort((a, b) => a.f - b.f);
                let current = frontier.shift();

                let key = current.x + "," + current.y;
                if (visited.has(key) && visited.get(key) <= current.g) continue;
                visited.set(key, current.g);

                if (current.x !== npc.x || current.y !== npc.y) {
                    exploredNodes.push({ x: current.x, y: current.y });
                }

                if (current.x === player.x && current.y === player.y) {
                    finalNode = current;
                    break;
                }

                let dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
                for (let d of dirs) {
                    let nx = current.x + d[0];
                    let ny = current.y + d[1];

                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && grid[ny][nx] !== 1 && grid[ny][nx] !== 2) {
                        let terrainCost = grid[ny][nx] === 3 ? 5 : 1;
                        let g = current.g + terrainCost;
                        let h = getHeuristic(nx, ny, algo);
                        let f = g + h;

                        frontier.push({ x: nx, y: ny, g: g, f: f, parent: current });
                    }
                }
            }

            currentPath = [];
            if (finalNode) {
                let temp = finalNode;
                while (temp.parent) {
                    currentPath.push({ x: temp.x, y: temp.y });
                    temp = temp.parent;
                }
                currentPath.reverse();
            }
            render();
        }

        window.addEventListener("keydown", (e) => {
            if (gameOver) return;
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(e.key) > -1) {
                e.preventDefault();
            }

            let moved = false;
            let nx = player.x;
            let ny = player.y;

            if (e.key === "w" || e.key === "ArrowUp") ny--;
            if (e.key === "s" || e.key === "ArrowDown") ny++;
            if (e.key === "a" || e.key === "ArrowLeft") nx--;
            if (e.key === "d" || e.key === "ArrowRight") nx++;

            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && grid[ny][nx] !== 1 && grid[ny][nx] !== 2) {
                player.x = nx;
                player.y = ny;
                moved = true;
            }

            if (moved) {
                recalculatePath();

                if (currentPath.length > 0) {
                    let nextStep = currentPath.shift();
                    npc.x = nextStep.x;
                    npc.y = nextStep.y;
                }

                if (npc.x === player.x && npc.y === player.y) {
                    triggerGameOver();
                } else {
                    recalculatePath();
                }
            }
        });

        function triggerGameOver() {
            gameOver = true;
            document.getElementById("acakMapBtn").style.display = "none";
            document.getElementById("resetBtn").style.display = "inline-block";
            render();
        }

        function resetGame() {
            player = { x: 18, y: 18 };
            npc = { x: 1, y: 1 };
            gameOver = false;
            document.getElementById("acakMapBtn").style.display = "inline-block";
            document.getElementById("resetBtn").style.display = "none";
            initGrid();
            recalculatePath();
        }

        // Eksekusi awal
        initGrid();
        recalculatePath();
    </script>
</body>

</html>
